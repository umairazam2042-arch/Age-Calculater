<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="All">
        <div class="main">
       <div class="name">
         <p>your life in Number</p>
    <h1>Age <span>Calculater</span></h1>
       </div>


    <div class="mid">
        <p>Apni date of birth daalen</p>
        <input type="date" placeholder="dd/mm/yyyy" class="screen"> <br>
        <button class="button">Calculate My Age</button>
    </div>

   
    
    </div>










    
  <div class="result hide">
    <div class="box">
        <div>
        <span id="years">0</span>
        <p>Years</p>
        </div>
    </div>
    <div class="box">
        <div>    
            <span id="months">0</span>
            <p>Months</p>
        </div>
    </div>
    <div class="box">
        <div>
            <span id="days">0</span>
            <p>Days</p>
        </div>
    </div>
</div>

<div class="moreResult hide">
    
        <div class="Days">
            <span>Kul Din (Total Days)</span>
            <p id="total-Days">-</p>
        </div> 
        <div class="Week">
            <span>Kul Hafte (Total Weeks)</span>
            <p id="Total-Week">-</p>
        </div> 
        <div class="Hour">
            <span>Kul Ghante (Total Hours)</span>
            <p id="Total-hours">-</p>
        </div> 
        <div class="BirthDay">
            <span>Aapka Din (Day of Birth)</span>
            <p id="Birth-day">-</p>
        </div>
</div>

 <p class="bottom">Made By Umair Azam</p>

    </div>
    <script src="script.js"></script>
</body>
</html>
